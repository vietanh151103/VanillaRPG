# VanillaRPG-Core 0.6.3
# Paper 26.2 / Java 25
# Missing keys are merged automatically when upgrading from 0.1.x.

starting-balance:
  coin: 250
  token: 0

market:
  enabled: true
  min-price: 1
  max-price: 1000000000
  # Initial price shown in the GUI sell screen. It is clamped to min/max-price.
  gui-default-price: 100
  max-active-listings-per-player: 10
  page-size: 45

# The server shop sells consumables and common building supplies. It buys only
# plain basic minerals with a daily Coin limit. Rare/RPG items are rejected.
shop:
  enabled: true
  page-size: 45
  # This cap controls inflation from mining farms. It resets at local midnight.
  max-sell-coin-per-day: 750
  items:
    bread_bundle:
      material: BREAD
      amount: 16
      price: 30
    baked_potato_bundle:
      material: BAKED_POTATO
      amount: 16
      price: 30
    cooked_beef_bundle:
      material: COOKED_BEEF
      amount: 8
      price: 45
    apple_bundle:
      material: APPLE
      amount: 16
      price: 20
    honey_bottle_bundle:
      material: HONEY_BOTTLE
      amount: 4
      price: 35
    dirt_bundle:
      material: DIRT
      amount: 64
      price: 24
    cobblestone_bundle:
      material: COBBLESTONE
      amount: 64
      price: 32
    deepslate_bundle:
      material: DEEPSLATE
      amount: 64
      price: 44
    stone_bundle:
      material: STONE
      amount: 64
      price: 70
    gravel_bundle:
      material: GRAVEL
      amount: 64
      price: 50
    sand_bundle:
      material: SAND
      amount: 64
      price: 64
    oak_log_bundle:
      material: OAK_LOG
      amount: 32
      price: 80
    oak_planks_bundle:
      material: OAK_PLANKS
      amount: 64
      price: 64
    glass_bundle:
      material: GLASS
      amount: 32
      price: 110
    bricks_bundle:
      material: BRICKS
      amount: 32
      price: 160
  # Price is per single item, not per stack. Only the listed basic minerals are accepted.
  sell-items:
    coal:
      material: COAL
      price-per-item: 2
      max-per-day: 256
    charcoal:
      material: CHARCOAL
      price-per-item: 2
      max-per-day: 128
    raw_copper:
      material: RAW_COPPER
      price-per-item: 2
      max-per-day: 256
    copper_ingot:
      material: COPPER_INGOT
      price-per-item: 2
      max-per-day: 128
    raw_iron:
      material: RAW_IRON
      price-per-item: 5
      max-per-day: 128
    iron_ingot:
      material: IRON_INGOT
      price-per-item: 5
      max-per-day: 128
    raw_gold:
      material: RAW_GOLD
      price-per-item: 8
      max-per-day: 64
    gold_ingot:
      material: GOLD_INGOT
      price-per-item: 8
      max-per-day: 64
    redstone:
      material: REDSTONE
      price-per-item: 1
      max-per-day: 256
    lapis:
      material: LAPIS_LAZULI
      price-per-item: 2
      max-per-day: 128
    quartz:
      material: QUARTZ
      price-per-item: 3
      max-per-day: 128
    amethyst:
      material: AMETHYST_SHARD
      price-per-item: 2
      max-per-day: 128
    flint:
      material: FLINT
      price-per-item: 1
      max-per-day: 128
    emerald:
      material: EMERALD
      price-per-item: 15
      max-per-day: 32
    diamond:
      material: DIAMOND
      price-per-item: 35
      max-per-day: 16

forge:
  reroll-cost:
    UNCOMMON: 250
    RARE: 750
    EPIC: 2500
    LEGENDARY: 7500
    MYTHIC: 15000

  # Named Legendary/Mythic items keep their identity and cannot reroll in 0.2.
  lock-named-endgame-reroll: true

  reroll-custom-materials:
    EPIC:
      epic_shard: 2

  # Progression rule:
  # COMMON -> UNCOMMON -> RARE: vanilla resources only.
  # RARE -> EPIC: farming material starts here.
  # LEGENDARY/MYTHIC: crafted from learned blueprint recipes in items.yml.
  upgrade:
    COMMON-to-UNCOMMON:
      coin: 500
      token: 0
      materials:
        EMERALD: 4

    UNCOMMON-to-RARE:
      coin: 1500
      token: 0
      materials:
        NETHERITE_INGOT: 1
        NETHERITE_UPGRADE_SMITHING_TEMPLATE: 1
        DIAMOND: 4

    RARE-to-EPIC:
      coin: 5000
      token: 5
      materials:
        NETHER_STAR: 1
        ECHO_SHARD: 4
      custom-materials:
        epic_shard: 8

combat:
  apply-to-players: false
  crit-message: true
  lifesteal-max-heal-per-hit: 4.0

particles:
  enabled: true
  # Resource-pack models replace persistent weapon particles in 0.2.8.
  weapon-effects-enabled: false
  view-distance: 48.0
  # Dedicated weapon-aura cadence. Lower = smoother, higher = lighter.
  weapon-interval-ticks: 4
  # Persistent weapon glow cadence. All effects below use Particle.TRAIL only.
  # No smoke, ash, cloud or end-rod particles are used by these weapon effects.
  swing-cooldown-ms: 180
  motion-min-distance: 0.055
  motion-max-distance: 2.5

  legendary:
    # Thin gold blade streak + movement afterimage + gold swing crescent.
    weapon-points: 6
    trail-duration-ticks: 6
    motion-trail: true
    swing-trail: true
    swing-points: 7

  mythic:
    # Longer double crimson helix, movement ribbon and double slash crescent.
    weapon-points: 9
    trail-duration-ticks: 7
    motion-trail: true
    swing-trail: true
    swing-points: 10
  forging-materials:
    enabled: true
    points: 3
  combat-effects: true
  craft-effects: true
  broadcast-endgame-crafts: true

# Generic weapon affix ranges. Values are percentages.
affixes:
  damage_bonus:
    min: 2.0
    max: 8.0
  crit_chance:
    min: 2.0
    max: 8.0
  crit_damage:
    min: 10.0
    max: 30.0
  lifesteal:
    min: 1.0
    max: 5.0
