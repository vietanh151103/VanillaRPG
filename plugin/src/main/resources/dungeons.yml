# VanillaRPG 0.4 dungeon definitions.
# 0.4.0 uses vanilla mobs with light RPG tuning: custom names, HP/damage multipliers and equipment.
# Dungeons are SOLO and one active run per dungeon in 0.4.0. Party/instances come later.
#
# First setup:
#   1) Build/find a dungeon room or just choose a test area.
#   2) Stand where players should enter.
#   3) Run: /dungeon setspawn <id>
#      This writes the current location and enables that dungeon automatically.
#
# reward.custom-items IDs come from items.yml.
# chance uses 0.0 - 1.0 (0.25 = 25%).

dungeons:
  one_chunk_dungeon:
    enabled: true
    name: "One Chunk Dungeon"
    description: "A compact dungeon world used to test direct world teleporting."
    icon: DEEPSLATE_BRICKS
    tier: 2
    recommended-rarity: RARE
    required-rarity: RARE
    cooldown-seconds: 600
    time-limit-seconds: 480
    use-world-spawn: false
    spawn:
      world: dungeon_one_chunk
      x: 0.5
      y: 65.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0
    mob-spawn-radius: 7.0
    mobs:
      - type: ZOMBIE
        name: "Dungeon Guard"
        count: 5
        health-multiplier: 1.45
        damage-multiplier: 1.20
        weapon: IRON_SWORD
        helmet: CHAINMAIL_HELMET
      - type: SKELETON
        name: "Bone Archer"
        count: 4
        health-multiplier: 1.25
        damage-multiplier: 1.15
        helmet: CHAINMAIL_HELMET
      - type: HUSK
        name: "Dungeon Brute"
        count: 2
        health-multiplier: 1.75
        damage-multiplier: 1.30
        weapon: IRON_AXE
        chestplate: CHAINMAIL_CHESTPLATE
    rewards:
      coin:
        min: 700
        max: 1200
      token:
        min: 1
        max: 2
      custom-items:
        epic_shard:
          chance: 0.55
          min: 1
          max: 2
        legendary_shard:
          chance: 0.05
          min: 1
          max: 1

