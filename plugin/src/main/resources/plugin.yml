name: VanillaRPG-Core
version: '${version}'
main: vn.vietanhrpg.core.VanillaRpgPlugin
api-version: '26.2'
softdepend: [AuctionHouse, BetterStructures, EliteMobs, WorldEdit]
author: VietAnh
description: Portable Vanilla+ RPG core for a small Paper server.

libraries:
  - org.xerial:sqlite-jdbc:3.50.3.0

commands:
  particles:
    description: Configure Legendary/Mythic particle effects.
    usage: /particles [all|legendary|mythic|combat|craft|materials|others] [on|off]
  poker:
    description: Enter and play the Texas Hold'em poker room.
    usage: /poker [start|hand|fold|check|call|raise <total>|status|leave]
  rpg:
    description: VanillaRPG administration.
    usage: /rpg <help|version|reload|mysticforest>

permissions:
  vanillarpg.admin:
    description: VanillaRPG administrative commands.
    default: op
