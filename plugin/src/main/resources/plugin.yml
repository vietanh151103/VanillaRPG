name: VanillaRPG-Core
version: '${version}'
main: vn.vietanhrpg.core.VanillaRpgPlugin
api-version: '26.2'
author: VietAnh
description: Portable Vanilla+ RPG core for a small Paper server.

libraries:
  - org.xerial:sqlite-jdbc:3.50.3.0

commands:
  coin:
    description: View or transfer Coin.
    usage: /coin [pay <player> <amount>]
  token:
    description: View Token balance.
    usage: /token
  profile:
    description: Open your RPG profile.
    usage: /profile
  quests:
    description: View Daily and Weekly quests.
    usage: /quests
  achievements:
    description: View RPG achievements.
    usage: /achievements
  titles:
    description: View and select unlocked titles.
    usage: /titles
  dungeons:
    description: Open the dungeon finder.
    usage: /dungeons
  dungeon:
    description: Join, leave or configure VanillaRPG dungeons.
    usage: /dungeon [join <id>|leave|status|setspawn <id>|resetcooldown <id>|reload]
  forge:
    description: Open the RPG Forge or use a forge action.
    usage: /forge [upgrade|reroll|inspect|recipes]
  blueprints:
    description: View learned and locked blueprint recipes.
    usage: /blueprints
  particles:
    description: Configure Legendary/Mythic particle effects.
    usage: /particles [all|legendary|mythic|combat|craft|materials|others] [on|off]
  market:
    description: Browse, sell, buy, cancel and claim player market items.
    usage: /market [browse|sell <price>|buy <id>|cancel <id>|claim|mine|history]
  shop:
    description: Browse supplies, sell minerals or view shop history.
    usage: /shop [history]
  rpg:
    description: VanillaRPG administration.
    usage: /rpg <reload|givecoin|givetoken|giveitem|givegear|giveblueprint|setrarity>

permissions:
  vanillarpg.admin:
    description: VanillaRPG administrative commands.
    default: op
  vanillarpg.dungeon.admin:
    description: Configure and reload VanillaRPG dungeons.
    default: op
  vanillarpg.market.use:
    description: Browse, buy and claim items from the player market.
    default: true
  vanillarpg.market.sell:
    description: Create and cancel player market listings.
    default: true
  vanillarpg.shop.use:
    description: Open the everyday supplies shop.
    default: true
