# VanillaRPG-Core 0.7.4
# All values are intentionally conservative for a ~10 player survival server.

mob-health-display:
  enabled: true
  update-interval-ticks: 10
  floating-damage:
    enabled: true
    duration-ticks: 20

# Disabled: EliteMobs owns item names, rarity, lore and gear presentation.
item-presentation:
  enabled: false

# Coin source is EliteMobs. The legacy VanillaRPG coin column is no longer used.
economy:
  source: elitemobs

poker:
  # Enable after PokerPack is merged into the resource pack sent by server.properties.
  item-models-enabled: true

shop:
  max-sell-coin-per-day: 750
  sell-items:
    coal:
      material: COAL
      price-per-item: 2
      max-per-day: 256
    charcoal:
      material: CHARCOAL
      price-per-item: 2
      max-per-day: 128
    raw_copper:
      material: RAW_COPPER
      price-per-item: 2
      max-per-day: 256
    copper_ingot:
      material: COPPER_INGOT
      price-per-item: 2
      max-per-day: 128
    raw_iron:
      material: RAW_IRON
      price-per-item: 5
      max-per-day: 128
    iron_ingot:
      material: IRON_INGOT
      price-per-item: 5
      max-per-day: 128
    raw_gold:
      material: RAW_GOLD
      price-per-item: 8
      max-per-day: 64
    gold_ingot:
      material: GOLD_INGOT
      price-per-item: 8
      max-per-day: 64
    redstone:
      material: REDSTONE
      price-per-item: 1
      max-per-day: 256
    lapis:
      material: LAPIS_LAZULI
      price-per-item: 2
      max-per-day: 128
    quartz:
      material: QUARTZ
      price-per-item: 3
      max-per-day: 128
    amethyst:
      material: AMETHYST_SHARD
      price-per-item: 2
      max-per-day: 128
    flint:
      material: FLINT
      price-per-item: 1
      max-per-day: 128
    emerald:
      material: EMERALD
      price-per-item: 15
      max-per-day: 32
    diamond:
      material: DIAMOND
      price-per-item: 35
      max-per-day: 16
  enabled: true
  page-size: 45
  items:
    dirt_bundle:
      category: BUILDING
      material: DIRT
      amount: 64
      price: 24
    cobblestone_bundle:
      category: BUILDING
      material: COBBLESTONE
      amount: 64
      price: 32
    deepslate_bundle:
      category: BUILDING
      material: DEEPSLATE
      amount: 64
      price: 44
    stone_bundle:
      category: BUILDING
      material: STONE
      amount: 64
      price: 70
    gravel_bundle:
      category: BUILDING
      material: GRAVEL
      amount: 64
      price: 50
    sand_bundle:
      category: BUILDING
      material: SAND
      amount: 64
      price: 64
    oak_log_bundle:
      category: BUILDING
      material: OAK_LOG
      amount: 32
      price: 80
    oak_planks_bundle:
      category: BUILDING
      material: OAK_PLANKS
      amount: 64
      price: 64
    glass_bundle:
      category: BUILDING
      material: GLASS
      amount: 32
      price: 110
    bricks_bundle:
      category: BUILDING
      material: BRICKS
      amount: 32
      price: 160
    bread_bundle:
      category: FOOD
      material: BREAD
      amount: 16
      price: 30
    baked_potato_bundle:
      category: FOOD
      material: BAKED_POTATO
      amount: 16
      price: 30
    cooked_beef_bundle:
      category: FOOD
      material: COOKED_BEEF
      amount: 8
      price: 45
    apple_bundle:
      category: FOOD
      material: APPLE
      amount: 16
      price: 20
    honey_bottle_bundle:
      category: FOOD
      material: HONEY_BOTTLE
      amount: 4
      price: 35
market:
  # Disabled while the market transaction layer is being migrated to Elite Coins.
  enabled: false
  gui-default-price: 100
  min-price: 1
  max-price: 1000000000
  max-active-listings-per-player: 10
  page-size: 45
particles:
  weapon-effects-enabled: false
  swing-cooldown-ms: 180
  motion-min-distance: 0.055
  motion-max-distance: 2.5
  forging-materials:
    enabled: true
    points: 3
  weapon-interval-ticks: 5
  enabled: true
  view-distance: 48.0
  interval-ticks: 10
  legendary:
    trail-duration-ticks: 6
    motion-trail: true
    swing-trail: true
    swing-points: 7
    weapon-points: 2
    amount: 3
  mythic:
    trail-duration-ticks: 7
    motion-trail: true
    swing-trail: true
    swing-points: 10
    weapon-points: 4
    amount: 6
  combat-effects: true
  craft-effects: true
  broadcast-endgame-crafts: true
starting-balance:
  coin: 250
  token: 0

forge:
  lock-named-endgame-reroll: true
  reroll-custom-materials:
    EPIC:
      epic_shard: 2
  reroll-cost:
    MYTHIC: 15000
    UNCOMMON: 250
    RARE: 750
    EPIC: 2500
    LEGENDARY: 7500
  
  # Legendary is intentionally locked until the boss/blueprint module is added.
  allow-legendary-without-blueprint: false
  
  upgrade:
    COMMON-to-UNCOMMON:
      coin: 500
      token: 0
      materials:
        EMERALD: 2
    
    UNCOMMON-to-RARE:
      coin: 1500
      token: 0
      materials:
        DIAMOND: 4
        NETHERITE_INGOT: 1
        NETHERITE_UPGRADE_SMITHING_TEMPLATE: 1
    
    RARE-to-EPIC:
      custom-materials:
        epic_shard: 8
      coin: 5000
      token: 2
      materials:
        NETHER_STAR: 1
        ECHO_SHARD: 4
    
    EPIC-to-LEGENDARY:
      coin: 15000
      token: 10
      materials:
        HEAVY_CORE: 1
        NETHER_STAR: 1
        DRAGON_BREATH: 8

combat:
  apply-to-players: false
  crit-message: true
  lifesteal-max-heal-per-hit: 4.0

# Initial weapon affix ranges. Values are percentages.
affixes:
  damage_bonus:
    min: 2.0
    max: 8.0
  crit_chance:
    min: 2.0
    max: 8.0
  crit_damage:
    min: 10.0
    max: 30.0
  lifesteal:
    min: 1.0
    max: 5.0

# Extra rewards injected into BetterStructures and vanilla/TerraformGenerator loot tables.
# These are per-container chances; 1.0 means 100%.
betterstructures-loot:
  enabled: false
  # Allows administrators to add the supplemental RPG loot once to a targeted existing container.
  manual-refresh-enabled: true
  surface:
    common-gear-chance: 0.14
    uncommon-gear-chance: 0.04
    rare-gear-chance: 0.005
    epic-shard-chance: 0.02
    epic-shard-min: 1
    epic-shard-max: 1
  underground:
    common-gear-chance: 0.18
    uncommon-gear-chance: 0.08
    rare-gear-chance: 0.025
    epic-shard-chance: 0.08
    epic-shard-min: 1
    epic-shard-max: 1
    echo-shard-chance: 0.1
    echo-shard-min: 1
    echo-shard-max: 2
  dungeon:
    common-gear-chance: 0.18
    uncommon-gear-chance: 0.12
    rare-gear-chance: 0.05
    epic-shard-chance: 0.12
    epic-shard-min: 1
    epic-shard-max: 1
    echo-shard-chance: 0.12
    echo-shard-min: 1
    echo-shard-max: 2
  nether:
    common-gear-chance: 0.12
    uncommon-gear-chance: 0.15
    rare-gear-chance: 0.08
    epic-gear-chance: 0.01
    epic-shard-chance: 0.16
    epic-shard-min: 1
    epic-shard-max: 2
    legendary-shard-chance: 0.025
    legendary-shard-min: 1
    legendary-shard-max: 1
    netherite-template-chance: 0.03
  end:
    uncommon-gear-chance: 0.15
    rare-gear-chance: 0.15
    epic-gear-chance: 0.02
    epic-shard-chance: 0.22
    epic-shard-min: 1
    epic-shard-max: 2
    legendary-shard-chance: 0.07
    legendary-shard-min: 1
    legendary-shard-max: 1
    heavy-core-chance: 0.05
  high-dungeon:
    uncommon-gear-chance: 0.2
    rare-gear-chance: 0.25
    epic-gear-chance: 0.05
    epic-shard-chance: 0.28
    epic-shard-min: 1
    epic-shard-max: 2
    legendary-shard-chance: 0.1
    legendary-shard-min: 1
    legendary-shard-max: 1
    mythic-core-chance: 0.015
    heavy-core-chance: 0.08
    netherite-template-chance: 0.06

# Vanilla/TerraformGenerator loot integration. The tier chances above are reused
# so vanilla structures and BetterStructures remain on the same economy curve.
vanilla-loot:
  enabled: false
  max-extra-items: 2
